name: Actions on pull requests
on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request-job:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: this-branch
            ref: ''
          # Unmodified upstream develop (adorsys/datasafe 28f411a) as a non-blocking baseline,
          # to separate pre-existing failures from regressions introduced by the pull request.
          - source: upstream-develop
            ref: 28f411adddf060f81aa620685001455bd16c1e50
    name: pull-request-job (${{ matrix.source }})
    steps:
      - name: Step 1 - Checkout repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Step 2 - Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Step 3 - Cache Docker images.
        uses: ScribeMD/docker-cache@0.3.7
        with:
          key: docker-${{ runner.os }}

      - name: Docker diagnostics
        if: matrix.source == 'this-branch'
        run: |
          {
            docker version --format 'client {{.Client.Version}} / server {{.Server.Version}} (API {{.Server.APIVersion}})'
            for image in minio/minio:RELEASE.2023-06-02T23-17-26Z quay.io/minio/minio:RELEASE.2023-06-02T23-17-26Z minio/minio:latest; do
              echo "--- docker pull $image"
              docker pull -q "$image" 2>&1 | tail -3 || true
            done
          } > docker-diag.txt 2>&1
          cat docker-diag.txt

      - name: Step 4 - Build & Test
        continue-on-error: ${{ matrix.source == 'upstream-develop' }}
        run: |
          set -o pipefail
          mvn clean verify -ntp -PIT -fae 2>&1 | tee build.log

      - name: Summarize build result
        if: always()
        run: |
          {
            echo "### datasafe build (${{ matrix.source }})"
            echo
            echo '```'
            if [ -f docker-diag.txt ]; then echo "--- docker diagnostics"; cat docker-diag.txt; echo "---"; fi
            grep -h -A6 "ContainerFetch\|Caused by" $(find . -path "*surefire-reports/*.txt" 2>/dev/null) 2>/dev/null | head -30 || true
            echo "SpotBugs findings: $(grep -cE '^\[ERROR\] (Low|Medium|High|Scary|Scariest|Troubling|Of Concern):' build.log || true)"
            grep -E "^\[ERROR\]|Tests run:.*(Failures: [1-9]|Errors: [1-9])|BUILD (SUCCESS|FAILURE)|Reactor Summary|SUCCESS \[|FAILURE \[|SKIPPED$" build.log \
              | grep -vE "^\[ERROR\] *$|^\[ERROR\] (Low|Medium|High|Scary|Scariest|Troubling|Of Concern):" | head -150 || true
            echo '```'
          } > build-summary.md
          cat build-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post summary to the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file build-summary.md

      - name: Step 5 - Upload coverage reports to Codecov
        if: matrix.source == 'this-branch'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
